    # J6 is solved from where the centre of the J5 circle sits relative to the J6 axis, so the
    # J5 arc (sweep_joint_B, +-15 deg) has to be swept in full. From the old wrist_pitch posture
    # the marker ran off the bottom of the frame part way through: 2026-09-21 captured only
    # 22.18 of 30 deg on the right arm and 26.29 on the left, both ending ~50 px from the image
    # edge, which biased the circle centre -- and the two arms unequally, since they lost
    # different amounts. The marker posture keeps the whole sweep in view (its own 40/40/45 deg
    # sweeps all complete with >100 px of margin).
