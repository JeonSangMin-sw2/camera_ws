  home_offset_reset_title:
    en: "Home Offset Reset Confirmation"
    ko: "Home Offset Reset 확인"
  home_offset_reset_msg:
    en: "⚠️ [WARNING] Home Offset Reset Notice\n\nResetting Home Offsets will redefine the current physical robot joint positions as the new 0° (Home Position).\n\nProcedure:\n1. Use Direct Teaching or manual positioning to precisely align both arms to the Home Pose.\n   (Do not turn Shoulder Roll so far inwards that the arm physically touches the body.)\n2. If resetting head offsets as well, align the head straight forward to the center.\n3. Click [Confirm (OK)] to begin the reset process.\n\n※ During reset, Control Manager will be paused, 48V power will be cycled, and robot connection will restart."
    ko: "⚠️ [경고] Home Offset Reset 알림\n\nHome Offset Reset을 진행하면 현재 로봇 관절의 물리적 위치가 새로운 0도(Home Position)로 재설정됩니다.\n\n진행 순서:\n1. Direct Teaching 등을 사용하여 양 팔을 홈 자세(Home Pose) 위치에 정확히 맞춥니다.\n   (어깨 롤은 팔이 몸체에 물리적으로 닿을 만큼 안쪽으로 넣지 마세요.)\n2. 헤드 오프셋도 초기화하려면 헤드를 정면 중앙으로 정렬합니다.\n3. [확인 (OK)]을 누르면 리셋 프로세스가 시작됩니다.\n\n※ 리셋 도중 Control Manager가 일시 중지되고 48V 전원이 재인가되며 로봇 연결이 재시작됩니다."

