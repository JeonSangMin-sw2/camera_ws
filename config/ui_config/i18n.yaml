wizard:
  title:
    en: "RBY1 Calibration Wizard"
    ko: "RBY1 캘리브레이션 마법사"
  btn_start_wizard:
    en: "Start"
    ko: "시작"
  btn_next:
    en: "Next"
    ko: "다음"
  btn_prev:
    en: "Previous"
    ko: "이전"
  btn_finish:
    en: "Finish"
    ko: "완료"
  btn_skip:
    en: "Skip Step"
    ko: "이 단계 건너뛰기"
  btn_back_overview:
    en: "Back to Overview"
    ko: "위자드로 돌아가기"
  btn_start_calibration:
    en: "Start Calibration"
    ko: "캘리브레이션 시작"
  btn_open_feed:
    en: "Open Camera Feed"
    ko: "카메라 피드 열기"
  btn_stop_motion:
    en: "Stop Motion"
    ko: "모션 정지"
  safety_title:
    en: "Safety & Monitoring Controls"
    ko: "안전 및 모니터링 제어"
  status_robot_connected:
    en: "Status: Robot Connected"
    ko: "상태: Step 2 - 로봇 연결 완료"
  status_disconnected:
    en: "Status: Disconnected"
    ko: "상태: 연결 해제"
  btn_connect:
    en: "CONNECT"
    ko: "CONNECT (로봇 연결)"

  slides:
    slide_0:
      title:
        en: "1-1. Camera Bracket Assembly & Mounting"
        ko: "1-1. 카메라 브라켓 조립 및 마운팅"
      box_title:
        en: "Camera Mounting Guidelines"
        ko: "카메라 마운팅 지침 사항"
      cap_head:
        en: "Robot with a head: fix the camera to the bracket, then bolt the bracket onto the head."
        ko: "헤드가 있는 로봇: 카메라를 브라켓에 고정한 뒤, 브라켓을 헤드 위에 볼트로 조립합니다."
      cap_nohead:
        en: "Robot without a head: fix the camera to the bracket, then bolt the bracket onto the body top plate."
        ko: "헤드가 없는 로봇: 카메라를 브라켓에 고정한 뒤, 브라켓을 몸체 상판에 볼트로 조립합니다."
      inst1:
        en: "1. Assemble the camera bracket that matches the robot (above) and make sure the camera is mounted securely without wobbling."
        ko: "1. 로봇 구성에 맞는 카메라 브라켓을 위 사진처럼 조립하고, 카메라가 흔들림 없이 견고하게 고정되었는지 확인하세요."
      inst2:
        en: "2. Check that the camera USB cable connection is stable."
        ko: "2. 카메라 USB 케이블 연결이 안정적인지 확인하세요."
      cam_box_title:
        en: "Connected Camera"
        ko: "인식된 카메라"
      cam_device:
        en: "Camera: {name}  (S/N {serial})  → {model} settings"
        ko: "카메라: {name}  (S/N {serial})  → {model} 설정 사용"
      cam_stream:
        en: "Resolution: {width}×{height} @ {fps} fps  (measured {measured})"
        ko: "해상도: {width}×{height} @ {fps} fps  (실측 {measured})"
      cam_intrinsics:
        en: "Intrinsics: {file}"
        ko: "내부 파라미터: {file}"
      cam_not_connected:
        en: "No camera connected. Check the USB 3 cable and reconnect the camera."
        ko: "카메라가 연결되지 않았습니다. USB 3 케이블을 확인하고 다시 연결하세요."
      cam_measuring:
        en: "measuring..."
        ko: "측정 중..."
      cam_unknown:
        en: "unknown"
        ko: "확인 불가"
      cam_warn_resolution:
        en: "Warning: the stream is not 1280×720. Replace the cable with a USB 3 cable."
        ko: "경고: 1280×720이 아닙니다. USB 3 케이블로 교체하세요."
      cam_warn_fps:
        en: "Warning: frames arrive slower than the set rate. Lower the exposure or improve the lighting."
        ko: "경고: 설정보다 프레임이 느리게 들어옵니다. 노출을 낮추거나 조명을 밝게 하세요."
      cam_warn_intrinsics:
        en: "Warning: no intrinsics file is in use. Calibrate and save the intrinsics first."
        ko: "경고: 사용 중인 내부 파라미터 파일이 없습니다. 내부 파라미터 보정 후 저장하세요."
    slide_1:
      title:
        en: "1-2. Gripper Removal"
        ko: "1-2. 그리퍼 분리"
      box_title:
        en: "Gripper Removal"
        ko: "그리퍼 분리 안내"
      inst1:
        en: "Remove grippers on both arms if mounted (refer to <a href=\"https://rainbowco-my.sharepoint.com/:p:/g/personal/support_rainbow-robotics_com/IQBQNoNxvENnSIt29V1aNsCCAYICOBKbsLJnAnvFFuTkA80?e=AEW1KM\" style=\"color: #00e5ff;\">Disassembly Guide</a>). The marker brackets are attached in the next step."
        ko: "양쪽 로봇 팔에 장착된 그리퍼를 제거하십시오 (<a href=\"https://rainbowco-my.sharepoint.com/:p:/g/personal/support_rainbow-robotics_com/IQBQNoNxvENnSIt29V1aNsCCAYICOBKbsLJnAnvFFuTkA80?e=AEW1KM\" style=\"color: #00e5ff;\">그리퍼 해체 가이드</a>). 마커 브라켓은 다음 단계에서 부착합니다."
    slide_marker_bracket:
      title:
        en: "1-3. Marker Bracket Attachment"
        ko: "1-3. 마커 브라켓 부착"
      box_title:
        en: "Marker Bracket Guidelines"
        ko: "마커 브라켓 부착 지침 사항"
      cap_assemble:
        en: "Bolt the bracket onto the arm end flange where the gripper was."
        ko: "그리퍼를 떼어낸 팔 말단 플랜지에 브라켓을 볼트로 고정합니다."
      cap_overview:
        en: "Right marker on the right arm, Left marker on the left arm (robot's own left/right)."
        ko: "Right 마커는 오른팔, Left 마커는 왼팔에 붙입니다 (로봇 기준 좌우)."
      inst1:
        en: "1. Attach marker brackets to both arm end-effectors (gripper and bolt specifications are identical)."
        ko: "1. 양쪽 로봇 팔 말단에 마커 브라켓을 부착하십시오(그리퍼와 볼트 규격이 동일합니다)."
      inst2:
        en: "2. Check the Right/Left label on each marker and attach it to the matching arm as in the right photo."
        ko: "2. 각 마커의 Right/Left 표시를 확인하고, 오른쪽 사진처럼 맞는 팔에 부착하세요."
      inst3:
        en: "3. Ensure markers are flat and clear of dust or distortion."
        ko: "3. 마커 표면이 구겨지거나 오염되지 않도록 유지하세요."
    slide_exposure:
      title:
        en: "3-3. Camera Exposure & Marker Recognition"
        ko: "3-3. 카메라 노출 및 마커 인식 확인"
      inst:
        en: "Press the teaching button and move both arms so that the two markers are in the camera view. Adjust the exposure until both markers are recognized without glare and hold still, then check 'Confirmed & Applied'."
        ko: "티칭 버튼을 누르고 두 마커가 카메라 화면에 들어오도록 양팔을 옮기세요. 두 마커가 빛 반사 없이 인식되고 값이 튀지 않을 때까지 노출을 조절한 뒤 '적용 완료했습니다'를 체크하십시오."
      monitor_title:
        en: "Marker Recognition Monitor"
        ko: "마커 인식 모니터"
      monitor_right:
        en: "Right marker"
        ko: "오른쪽 마커"
      monitor_left:
        en: "Left marker"
        ko: "왼쪽 마커"
      monitor_idle:
        en: "{marker}: not monitoring"
        ko: "{marker}: 모니터링 안 함"
      monitor_stable:
        en: "{marker}: stable ✓  |  detection {rate}%  |  jitter {jitter}"
        ko: "{marker}: 안정 ✓  |  인식률 {rate}%  |  흔들림 {jitter}"
      monitor_unstable:
        en: "{marker}: jumping (RMS above {limit} mm)  |  detection {rate}%  |  jitter {jitter}"
        ko: "{marker}: 흔들림 큼 (RMS {limit} mm 초과)  |  인식률 {rate}%  |  흔들림 {jitter}"
      monitor_hidden:
        en: "{marker}: NOT recognized  |  detection {rate}%  |  jitter {jitter}"
        ko: "{marker}: 인식 안 됨  |  인식률 {rate}%  |  흔들림 {jitter}"
      monitor_all_ok:
        en: "✅ Both markers recognized with RMS jitter ≤ {limit} mm: exposure OK"
        ko: "✅ 두 마커 모두 인식, 흔들림 RMS {limit} mm 이하: 노출 설정 성공"
      monitor_not_ok:
        en: "Not yet: both markers must be recognized with RMS jitter ≤ {limit} mm (arms held still)"
        ko: "아직 아님: 팔을 멈춘 상태에서 두 마커 모두 인식되고 흔들림 RMS {limit} mm 이하여야 합니다"
      monitor_jitter:
        en: "RMS {rms} mm / max {max} mm"
        ko: "RMS {rms} mm / 최대 {max} mm"
      monitor_note:
        en: "Detection rate and jitter cover the last {window} raw (unfiltered) detections per marker. Read the jitter with the arms held still: it shows how much the marker position jumps between frames."
        ko: "인식률과 흔들림은 마커별 최근 {window}회의 필터 없는 원시 검출값입니다. 흔들림은 팔을 멈춘 상태에서 보세요. 프레임마다 마커 위치가 얼마나 튀는지를 나타냅니다."
      monitor_restart:
        en: "Restart monitor"
        ko: "모니터 다시 시작"
      auto_exposure:
        en: "Auto Exposure Mode"
        ko: "자동 노출 모드"
      exposure_label:
        en: "Exposure Time (μs):"
        ko: "노출 시간 (μs):"
      btn_apply:
        en: "APPLY"
        ko: "적용"
      btn_cancel:
        en: "CANCEL"
        ko: "취소"
      chk_confirmed:
        en: "I have confirmed and applied the camera brightness. (적용 완료했습니다)"
        ko: "카메라 밝기 설정을 확인하고 적용 완료했습니다."
      status_waiting:
        en: "Status: Adjust brightness and check 'Confirmed & Applied' to enable NEXT."
        ko: "상태: 밝기 조절 후 '적용 완료했습니다'를 체크해야 다음 단계로 진행할 수 있습니다."
      status_confirmed:
        en: "Status: Exposure Confirmed! You can now click NEXT."
        ko: "상태: 카메라 밝기 설정 완료! 다음(NEXT) 버튼을 눌러 진행하세요."
    slide_2:
      title:
        en: "1-4. Camera Intrinsics Check (Optional)"
        ko: "1-4. 카메라 내부 파라미터 확인 (선택)"
      box_title:
        en: "Camera Parameter Verification"
        ko: "카메라 파라미터 검증"
      inst1:
        en: "Camera lens distortion may affect tracking accuracy. Calibrate camera intrinsics if necessary."
        ko: "카메라 렌즈 왜곡은 마커 추적 정밀도에 영향을 줄 수 있습니다. 필요시 내부 파라미터를 보정하세요."
      skip_note:
        en: "Please proceed if you have a checkerboard or if the environment is harsh (high temperature, bright light). Otherwise, proceed to the next step."
        ko: "체커보드가 있거나, 환경이 열약하다면(높은 온도, 밝은 빛) 진행해주세요. 그렇지 않다면 다음 단계로 이동하세요."
      btn_go:
        en: "Calibrate Camera Intrinsics"
        ko: "카메라 내부 파라미터 보정"
    slide_3:
      title:
        en: "2. Camera Intrinsics Calibration (Optional)"
        ko: "2. 카메라 내부 파라미터 보정 (선택)"
      skip_hint:
        en: "If you have already completed this step, click Next or Skip to proceed."
        ko: "이미 완료하셨다면 다음 또는 건너뛰기 버튼을 누르세요."
      box_guidelines:
        en: "Calibration Guidelines"
        ko: "보정 가이드라인"
      box_controls:
        en: "Calibration Controls"
        ko: "보정 제어"
      box_stats:
        en: "Capture Stats"
        ko: "캡처 통계"
      guide_overlay:
        en: "Show Guide Overlay"
        ko: "가이드 오버레이 표시"
      btn_capture:
        en: "CAPTURE FRAME (C)"
        ko: "프레임 캡처 (C)"
      btn_calibrate:
        en: "RUN CALIBRATION"
        ko: "캘리브레이션 실행"
      btn_save:
        en: "SAVE PARAMETERS"
        ko: "파라미터 저장"
      btn_reset:
        en: "RESET CAPTURES"
        ko: "캡처 리셋"
      lbl_captured:
        en: "Captured Frames: "
        ko: "캡처된 프레임: "
      lbl_temp:
        en: "Camera Temp: "
        ko: "카메라 온도: "
      inst1:
        en: "1. Ensure the calibration board is recognized correctly (green overlay)."
        ko: "1. 체커보드/마커가 정상 인식되는지 확인하세요 (초록색 오버레이)."
      inst2:
        en: "2. Capture data covering all 16 guideline poses/regions across camera view."
        ko: "2. 화면 전체에 걸쳐 16개의 가이드 영역 포즈를 캡처하세요."
      inst3:
        en: "3. All 16 valid frames must be collected to run calibration & save."
        ko: "3. 16개의 유효 프레임을 수집해야 보정 및 저장이 가능합니다."
      inst4:
        en: "4. Keep the calibration board steady during each capture."
        ko: "4. 캡처 중에는 보드를 흔들리지 않게 들고 계세요."
    slide_4:
      title:
        en: "3. Robot Connection"
        ko: "3. 로봇 연결"
      box_title:
        en: "Robot Connection & Initialization"
        ko: "로봇 연결 및 초기화"
      inst1:
        en: "Connect to the robot using the configured IP address."
        ko: "설정된 IP 주소를 사용하여 로봇에 연결하십시오."

      additional_bracket_query:
        en: "Are you using an additional camera bracket?"
        ko: "추가 카메라 브라켓을 사용하시나요?"
      "yes":
        en: "Yes"
        ko: "예"
      "no":
        en: "No"
        ko: "아니오"
    slide_5:
      title:
        en: "3-1. Initial Zero Position Setup"
        ko: "3-1. 초기 제로 포즈 이동"
      box_title:
        en: "Zero Position Movement"
        ko: "제로 포즈 이동 안내"
      inst1:
        en: "To set up the baseline, first move the robot arms to the initial zero position."
        ko: "기준 위치 설정을 위해 로봇 팔을 초기 제로 포즈로 이동시킵니다."
      btn_move_zero:
        en: "Move to Zero Position"
        ko: "제로 포즈로 이동"
    slide_6:
      title:
        en: "3-2. Home Offset Position Setup"
        ko: "3-2. 홈 오프셋 위치 설정"
      skip_hint:
        en: "If you have already completed this step or are testing in simulation, please skip this process."
        ko: "이미 이 스텝을 진행했거나 시뮬레이션에서 테스트해보고 있는 경우, 이 과정을 스킵해주세요."
      box_title:
        en: "Teaching Posture Guidelines"
        ko: "교시 자세 지침 사항"
      btn_how_to_move:
        en: "How to move arms?"
        ko: "팔 이동 방법 안내"
      btn_reset:
        en: "Reset Home Offset"
        ko: "홈 오프셋 리셋"
      inst1:
        en: "1. Rotate Shoulder Roll inwards towards the body."
        ko: "1. 어깨 롤(Shoulder Roll) 관절을 몸 안쪽 방향으로 회전시킵니다."
      shoulder_warn:
        en: "⚠ Do not turn it so far that the arm physically touches the body."
        ko: "⚠ 팔이 몸체에 물리적으로 닿을 만큼 안쪽으로 넣지 마세요."
      inst2:
        en: "2. Push Elbow fully backwards until physically contacted / stopped."
        ko: "2. 팔꿈치(Elbow) 관절을 스토퍼에 닿을 때까지 완전히 뒤로 밀어 붙입니다."
      inst3:
        en: "3. Once steps 1~2 are complete, click 'Reset Home Offset' button below."
        ko: "3. 위 과정이 완료되면 아래 '홈 오프셋 리셋' 버튼을 눌러 조인트 영점을 재설정하세요."
    slide_7:
      title:
        en: "4. Calibration Start"
        ko: "4. 캘리브레이션 시작"
      desc:
        en: "Click 'Start Calibration' to execute Full Auto calibration, initial pose setup, auto motion data collection, and 3D optimization in one unified process."
        ko: "'캘리브레이션 시작' 버튼을 누르면 풀 오토 캘리브레이션부터 초기 포즈 이동, 자동 궤적 수집 및 3D 최적화 연산까지 일괄 진행됩니다."
      feed_desc:
        en: "Check marker recognition status ->"
        ko: "마커 인식 상태 확인 ->"
      stop_desc:
        en: "Emergency stop on abnormal motion ->"
        ko: "비정상 동작 시 모션 정지 ->"
    slide_8:
      title:
        en: "5. Apply Home Offset"
        ko: "5. 홈 오프셋 적용"
      desc:
        en: "Review and apply the calculated optimized home offset to the robot."
        ko: "계산된 최적화 홈 오프셋을 검토하고 로봇에 적용합니다."
      box_title:
        en: "Apply Home Offset Instructions"
        ko: "홈 오프셋 적용 지침 사항"
      inst1:
        en: "1. Comparison: Review and compare offsets before and after calibration using 'Baseline' and 'Optimized'."
        ko: "1. 비교: 'Baseline' 및 'Optimized'를 선택하여 보정 전후 오프셋을 비교해 볼 수 있습니다."
      inst2:
        en: "2. Zero Pose Check: Use 'Rollback Zero Pose' / 'New Offset Zero Pose' to move the joints to zero with the original or the calibrated offsets and compare them."
        ko: "2. 제로 포즈 검사: '원본 제로 자세' / '보정 제로 자세'를 눌러 기존 영점과 보정된 영점으로 각각 이동해 비교하세요."
      inst3:
        en: "3. Symmetry Check: Use 'Rollback Check Pose' / 'New Offset Check Pose' to verify if both robot arms are symmetrical."
        ko: "3. 대칭성 검사: '원본 체크 자세' / '보정 체크 자세'를 눌러 두 팔이 대칭을 이루는지 확인하세요."
      inst4:
        en: "4. Apply / Rollback: Select 'Baseline' to rollback to original values, or select 'Optimized' to apply calibrated values, then click 'Apply Selected Offset'."
        ko: "4. 적용/롤백: 적용을 원하는 값(Baseline 또는 Optimized)을 선택한 뒤 '선택한 오프셋 적용' 버튼을 클릭하세요."
      btn_apply:
        en: "Apply Home Offset"
        ko: "홈 오프셋 적용"
      btn_rollback_zero:
        en: "Rollback Zero Pose"
        ko: "원본 제로 자세"
      btn_new_offset_zero:
        en: "New Offset Zero Pose"
        ko: "보정 제로 자세"
      btn_rollback_preview:
        en: "Rollback Check Pose"
        ko: "원본 체크 자세"
      btn_new_offset_preview:
        en: "New Offset Check Pose"
        ko: "보정 체크 자세"
      btn_rollback_joint:
        en: "Rollback Joint"
        ko: "기존 영점 복구 (Rollback)"
      btn_apply_new_offset:
        en: "Apply New Offset"
        ko: "신규 보정 적용 (Apply)"

  step6:
    no_json:
      en: "No {state} JSON found."
      ko: "{state} 설정 파일을 찾을 수 없습니다."
    moving_check:
      en: "Status: Moving to {state} check posture..."
      ko: "상태: {state} 체크 자세로 이동 중..."
    arrived_check:
      en: "Status: Arrived at {state} check posture."
      ko: "상태: {state} 체크 자세 도착 완료."
    preview_complete_title:
      en: "Preview Complete"
      ko: "이동 완료"
    preview_complete_msg:
      en: "Moved to {state} check position."
      ko: "{state} 체크 자세로 이동 완료되었습니다."
    arrived_zero:
      en: "Status: Arrived at {state} zero pose."
      ko: "상태: {state} 영점 도착 완료."
    preview_zero_msg:
      en: "Moved to {state} zero pose."
      ko: "{state} 영점으로 이동 완료되었습니다."
    preview_error_status:
      en: "Status: Preview Error"
      ko: "상태: 이동 에러"
    preview_error_title:
      en: "Preview Error"
      ko: "이동 에러"
    confirm_title:
      en: "Confirm Apply"
      ko: "적용 확인"
    confirm_msg:
      en: |
        Are you sure you want to apply the '{state}' offsets?

        The robot will move to the Zero Pose of '{state}', and then reset/apply the home offset.
        Please ensure the workspace around the robot is clear.
      ko: |
        '{state}' 오프셋을 정말로 적용하시겠습니까?

        로봇이 '{state}'의 영점(Zero Pose)으로 이동한 후, 물리 홈 오프셋 리셋을 수행합니다.
        로봇 주변의 작업 공간이 비어 있는지 확인해 주세요.
    moving_zero:
      en: "Status: Moving to {state} Zero Pose..."
      ko: "상태: {state} 영점으로 이동 중..."
    move_zero_error_status:
      en: "Status: Move Error"
      ko: "상태: 이동 에러"
    move_zero_error_title:
      en: "Zero Pose Move Error"
      ko: "영점 이동 에러"
    move_zero_error_msg:
      en: "Failed to move to zero pose before applying: {error_msg}"
      ko: "적용 전 영점 이동 실패: {error_msg}"
    applying_offset:
      en: "Status: Applying {state} Home Offset..."
      ko: "상태: {state} 물리 홈 리셋 적용 중..."
    success_status:
      en: "Status: SUCCESS - {state} applied"
      ko: "상태: 성공 - {state} 적용 완료"
    success_title:
      en: "Success"
      ko: "성공"
    success_msg:
      en: "Robot moved to Zero Pose and '{state}' home offset applied successfully."
      ko: "로봇이 영점으로 이동하였으며 '{state}' 물리 홈 오프셋 리셋이 성공적으로 적용되었습니다."
    partial_fail_status:
      en: "Status: Partial Failure"
      ko: "상태: 부분 실패"
    partial_fail_title:
      en: "Warning"
      ko: "경고"
    partial_fail_msg:
      en: "Home offset apply finished, but some joints failed to reset. Please check the logs."
      ko: "홈 오프셋 리셋이 끝났으나 일부 관절 리셋에 실패했습니다. 로그를 확인해 주세요."
    apply_error_status:
      en: "Status: Apply Error"
      ko: "상태: 적용 에러"
    apply_error_title:
      en: "Apply Pose Error"
      ko: "적용 에러"

dialogs:
  how_to_move_arms:
    title:
      en: "How to Move Arms (Direct Teaching)"
      ko: "팔 이동 방법 (Direct Teaching)"
    lbl_title:
      en: "Direct Teaching Button Usage"
      ko: "직접 교시 버튼 사용 안내"
    box_title:
      en: "Direct Teaching Steps"
      ko: "직접 교시 사용 안내"
    step1:
      en: "1. Press the direct teaching button on each arm to manually adjust key joint postures."
      ko: "1. 각 팔의 직접 교시 버튼을 눌러 수동으로 주요 관절 위치를 설정합니다."
    step2:
      en: "2. Important: Manually move target joints so calibration offsets are calculated in the correct direction."
      ko: "2. 중요: 보정값이 반대 방향으로 계산되어 오작동을 일으키지 않도록, 지정된 주요 관절을 수작업으로 옮겨주어야 합니다."
    warn_lbl:
      en: "⚠️ Warning: NEVER press teaching buttons on both arms simultaneously!"
      ko: "⚠️ 경고: 양팔의 직접 교시 버튼을 절대로 동시에 누르지 마십시오!"
    btn_close:
      en: "Close"
      ko: "확인 (Close)"
  how_to_move:
    title:
      en: "How to Move Arms (Direct Teaching Guide)"
      ko: "로봇 팔 이동 방법 안내 (직접 교시 가이드)"
    content:
      en: |
        [How to Move Robot Arms Directly]

        1. Control Button: Press the teaching button on the arm wrist/body.
        2. Gravity Compensation: Hold the button down to activate gravity compensation (Direct Teaching Mode).
        3. Manual Positioning: While holding the button, physically push the arm into the required reference posture.
        4. Release: Release the button once the posture is set.
      ko: |
        [로봇 팔 직접 교시 방법 안내]

        1. 조작 버튼: 로봇 손목/팔 부위의 교시 버튼을 누릅니다.
        2. 중력 보상: 버튼을 누르고 있는 동안 중력 보상(직접 교시 모드)이 활성화됩니다.
        3. 수동 이동: 버튼을 누른 상태에서 지정된 기준 자세(어깨 롤 몸쪽 회전, 팔꿈치 후방 밀착)로 손으로 직접 조작하여 맞춥니다.
        4. 해제: 자세가 구비되면 버튼에서 손을 뗍니다.
  camera_intrinsics_warning:
    title:
      en: "Camera Intrinsics Warning"
      ko: "카메라 내부 파라미터 경고"
    text:
      en: "Connected camera model ({connected_model}) does not match camera model in intrinsics calibration file ({calib_device})."
      ko: "연결된 카메라 기종({connected_model})과 내부 파라미터 파일의 기종({calib_device})이 다릅니다."
    informative_text:
      en: "Please recalibrate the camera intrinsics (camera_intrinsics.yaml) for the connected model."
      ko: "내부 파라미터(camera_intrinsics.yaml)를 현재 카메라에 맞게 보정해 주세요."

  camera_intrinsics_missing:
    title:
      en: "Camera Intrinsics Not Found"
      ko: "카메라 내부 파라미터 없음"
    text:
      en: "No saved intrinsics calibration for the connected camera ({connected_model}); config/camera_intrinsics_{store}.yaml does not exist."
      ko: "연결된 카메라({connected_model})의 내부 파라미터 보정 파일이 없습니다. (config/camera_intrinsics_{store}.yaml 없음)"
    informative_text:
      en: "The camera's factory intrinsics are being used for now, so marker poses will be less accurate. Run Step 1 (Camera Intrinsics Calibration) and save the result; it is stored per camera model, so this is asked only once for each camera."
      ko: "지금은 카메라의 공장 출하 내부 파라미터로 동작하므로 마커 자세 정확도가 떨어집니다. Step 1(카메라 내부 파라미터 보정)을 실행하고 결과를 저장해 주세요. 기종별로 저장되므로 카메라마다 한 번만 하면 됩니다."

  camera_extrinsics_missing:
    title:
      en: "Camera Bracket Data Not Found"
      ko: "카메라 브라켓 정보 없음"
    text:
      en: "config/camera_info.yaml has no entry for the connected camera ({connected_model})."
      ko: "config/camera_info.yaml에 연결된 카메라({connected_model}) 항목이 없습니다."
    informative_text:
      en: "setting.yaml was left as it is, so the bracket transform belongs to a different camera and the calibration result will be wrong. Measure head_base_to_cam and mount_to_cam for this model and add a '{connected_model}' entry to camera_info.yaml."
      ko: "setting.yaml을 그대로 두었기 때문에 브라켓 변환이 다른 카메라 기준이며 보정 결과가 틀어집니다. 이 기종의 head_base_to_cam과 mount_to_cam을 측정해 camera_info.yaml에 '{connected_model}' 항목으로 추가해 주세요."

  zero_pose_check:
    title:
      en: "Zero Pose Check"
      ko: "제로 포즈 확인"
    guide_msg:
      en: |
        The robot has moved to zero pose.

        Please compare the actual robot posture with the reference image.

        - If the posture matches the reference, you can proceed with data collection.
        - If the posture does not match and the two target joints appear outside the recommended range,
          use direct teaching to move the robot to the recommended posture,
          perform reset first, and then start data collection.
      ko: |
        로봇이 제로 포즈로 이동했습니다.

        실제 로봇의 자세를 기준 이미지와 비교해 주십시오.

        - 자세가 기준 이미지와 일치하면 데이터 수집을 계속 진행할 수 있습니다.
        - 자세가 일치하지 않고 대상 관절 2개가 권장 범위를 벗어난 것으로 보이면,
          직접 교시를 사용하여 로봇을 권장 자세로 이동시킨 후
          먼저 리셋을 수행하고 데이터 수집을 시작하십시오.

  marker_problem:
    title:
      en: "Marker Recognition Problem & Teaching Guidance"
      ko: "마커 인식 오류 및 수동 위치 교시 가이드"
    warn_header:
      en: "⚠️ Marker Unrecognized: Manual Teaching & View Alignment"
      ko: "⚠️ 마커 미인식: 수동 위치 교시 및 카메라 시야 확보 안내"
    steps_box_title:
      en: "Manual Teaching Steps"
      ko: "수동 위치 교시 절차"
    feed_box_title:
      en: "Live Camera Feed"
      ko: "실시간 카메라 피드 (Live Feed)"
    feed_loading:
      en: "Camera Feed Loading..."
      ko: "카메라 피드 로딩 중..."
    btn_done:
      en: "✅ Teaching Done (Resume Calibration)"
      ko: "✅ 티칭 완료 (캘리브레이션 재개)"
    btn_cancel:
      en: "❌ Cancel Calibration"
      ko: "❌ 캘리브레이션 취소"
    step1_cap:
      en: "1. Unrecognized"
      ko: "1. 미인식 발생"
    step2_cap:
      en: "2. Press Teaching"
      ko: "2. 교시 버튼 누름"
    step3_cap:
      en: "3. Align Marker"
      ko: "3. 마커 정면 조향"
    desc:
      en: "<b>1. Press Teaching Button:</b> Press the direct teaching button on the robot arm/head.<br><br><b>2. Align Marker:</b> Watching the live camera feed on the right, position the marker in the center of the camera view.<br><br><b>3. Resume Calibration:</b> Click [Teaching Done] below once aligned.<br><span style='color: #ffca28; font-size: 13px;'>* Resumes calibration by aligning only the target calibration joint to 0° from adjusted posture.</span>"
      ko: "<b>1. 티칭 버튼 누르기:</b> 로봇 팔/헤드의 직접 교시 버튼(Teaching Button)을 누르세요.<br><br><b>2. 마커 방향 조정:</b> 우측 실시간 카메라 화면을 보면서 마커가 화각 중앙에 정면으로 오도록 이동시키세요.<br><br><b>3. 캘리브레이션 재개:</b> 정렬을 마치면 아래 [티칭 완료] 버튼을 누르세요.<br><span style='color: #ffca28; font-size: 13px;'>* 조정한 현재 위치에서 보정 대상 관절만 0°로 정렬 후 스위프를 계속 진행합니다.</span>"

  markers_too_close:
    title:
      en: "Markers Too Close"
      ko: "마커 간격 부족"
    notice_msg:
      en: |
        The two markers are too close together.

        Measured gap (camera horizontal axis): {gap} cm
        Required minimum: {min_gap} cm

        The arms may collide while they move to collect Step 2 data.
        Press OK to open the spacing monitor, then widen the distance between the two markers with direct teaching.
      ko: |
        두 마커의 간격이 너무 가깝습니다.

        측정 간격 (카메라 가로축): {gap} cm
        최소 기준: {min_gap} cm

        Step 2 데이터 수집 중 팔이 움직이면서 충돌할 수 있습니다.
        확인을 누르면 간격 모니터 창이 열립니다. 직접 교시로 두 마커 사이를 벌려 주세요.
    monitor_title:
      en: "Marker Spacing Monitor"
      ko: "마커 간격 모니터"
    monitor_header:
      en: "⚠️ Widen the arms: markers are too close"
      ko: "⚠️ 팔 간격 벌리기: 마커가 너무 가깝습니다"
    monitor_desc:
      en: "Press the teaching button and move the arms apart, keeping both markers in view of the camera. The gap turns green at {min_gap} cm or more; then press [Spacing Done]. Step 2 continues from this posture without checking the spacing again."
      ko: "티칭 버튼을 누르고 두 마커가 카메라에 보이도록 유지하면서 팔 사이를 벌리세요. 간격이 {min_gap} cm 이상이 되면 초록색으로 바뀌고, 그때 [간격 조정 완료]를 누르세요. 이후 Step 2는 이 자세에서 간격을 다시 확인하지 않고 진행합니다."
    gap_value:
      en: "Marker gap: {gap} cm  (minimum {min_gap} cm)"
      ko: "마커 간격: {gap} cm  (기준 {min_gap} cm 이상)"
    gap_hidden:
      en: "Marker not visible: keep both markers in view  (minimum {min_gap} cm)"
      ko: "마커가 보이지 않음: 두 마커가 모두 보이게 하세요  (기준 {min_gap} cm 이상)"
    btn_done:
      en: "✅ Spacing Done (Continue Step 2)"
      ko: "✅ 간격 조정 완료 (Step 2 계속)"
    btn_cancel:
      en: "❌ Cancel Step 2"
      ko: "❌ Step 2 취소"

  apply_home_offset:
    title:
      en: "Apply Home Offset"
      ko: "홈 오프셋 적용"
    opt_locked_title:
      en: "Optimized Result Locked"
      ko: "최적화 결과 적용 잠김"
    opt_locked:
      en: "The optimized result can be previewed (zero / check pose) but not applied: it was not calculated in this run from data collected at the current robot zero (a saved npz dataset, a previous run, or data from before a home offset reset/apply), or it has already been applied. Applying it again would add the offsets twice (an already applied result also shows them twice in the preview). Run the calibration (data collection + Calculate) again to apply. Rollback to the baseline is available."
      ko: "최적화 결과는 미리보기(영점·확인 자세)만 가능하고 적용할 수 없습니다. 이번 실행에서 현재 로봇 영점 기준으로 수집한 데이터로 계산한 결과가 아니거나(저장된 npz 데이터셋, 이전 실행, 홈 오프셋 리셋·적용 전에 모은 데이터), 이미 적용된 결과입니다. 다시 적용하면 보정값이 중복으로 더해집니다(이미 적용된 결과는 미리보기 자세에도 중복으로 더해집니다). 적용하려면 보정(데이터 수집 + Calculate)을 다시 실행하세요. 기준값(Baseline) 롤백은 가능합니다."
    guide_msg:
      en: |
        Compare the original baseline zero and the optimized zero before applying.

        1. Select Baseline or Optimized state.
        2. Move to Zero to inspect the zero pose before calibration reset.
        3. Move to Check Position to move the robot to the custom check pose.
        4. Apply the pose you want to keep using Rollback or Apply Optimized Result.

        Make sure the workspace is clear before each move.
      ko: |
        오프셋을 적용하기 전에 원래 기준(Baseline) 제로와 최적화(Optimized) 제로를 비교하세요.

        1. Baseline 또는 Optimized 상태를 선택합니다.
        2. 'Move to Zero'를 눌러 캘리브레이션 리셋 전 제로 자세를 확인합니다.
        3. 'Move to Check'를 눌러 로봇을 커스텀 확인 자세로 이동합니다.
        4. Rollback 또는 Apply Optimized Result를 사용하여 유지할 자세를 적용합니다.

        각 동작 전 로봇 주변 작업 공간이 안전한지 반드시 확인하세요.
    confirm_title:
      en: "Confirm Apply"
      ko: "오프셋 적용 확인"
    confirm_msg:
      en: |
        Are you sure you want to apply the '{state}' offsets?

        The robot will first move to the Zero Pose of '{state}', and then reset/apply the home offset.
        Please ensure the workspace around the robot is clear.
      ko: |
        '{state}' 오프셋을 적용하시겠습니까?

        로봇이 먼저 '{state}'의 제로 포즈로 이동한 후, 홈 오프셋을 리셋/적용합니다.
        로봇 주변 작업 공간이 비어있는지 확인하세요.
    btn_baseline:
      en: "BASELINE\n(Rollback)"
      ko: "BASELINE\n(롤백)"
    btn_optimized:
      en: "OPTIMIZED\n(Apply)"
      ko: "OPTIMIZED\n(적용)"
    btn_move_zero:
      en: "Move to Zero"
      ko: "제로 포즈로 이동"
    btn_move_check:
      en: "Move to Check"
      ko: "확인 자세로 이동"
    btn_apply_selected:
      en: "Apply Selected Offset"
      ko: "선택한 오프셋 적용"
    btn_close:
      en: "Close"
      ko: "닫기"
    preview_complete_title:
      en: "Preview Complete"
      ko: "프리뷰 완료"
    preview_complete_msg:
      en: "Moved to {state} {target} candidate."
      ko: "{state} {target} 후보 포즈로 이동했습니다."
    preview_error_title:
      en: "Preview Error"
      ko: "프리뷰 오류"
    apply_success_title:
      en: "Success"
      ko: "성공"
    apply_success_msg:
      en: "Robot moved to Zero Pose and '{state}' home offset applied successfully. Software joint offsets have been reset to 0.0."
      ko: "로봇이 제로 포즈로 이동하고 '{state}' 홈 오프셋이 성공적으로 적용되었습니다. 소프트웨어 조인트 오프셋이 0.0으로 리셋되었습니다."
    apply_partial_warn:
      en: "Home offset apply finished, but some joints failed to reset. Please check the logs."
      ko: "홈 오프셋 적용이 완료되었으나 일부 관절 리셋에 실패했습니다. 로그를 확인하세요."

  joint_limit_exceeded:
    title:
      en: "Joint Limit Exceeded"
      ko: "관절 가동 범위 초과"
    msg:
      en: "The manually adjusted robot posture exceeds the joint limits. Please adjust the posture again.\n\n{details}"
      ko: "수동으로 조정한 로봇의 자세가 가동 범위를 벗어났습니다. 다시 자세를 조정해주세요.\n\n{details}"
    joint_line:
      en: "- Joint {joint}: Current {val}°, Limits [{low}°, {upp}°]"
      ko: "- 관절 {joint}: 현재 {val}°, 제한 범위 [{low}°, {upp}°]"

  home_offset_reset_warn:
    title:
      en: "Confirm Home Offset Reset"
      ko: "Home Offset Reset 확인"
    msg:
      en: |
        ⚠️ [Warning] Home Offset Reset Notice

        Proceeding with Home Offset Reset will reset the current physical positions of robot joints as the new 0 degrees (Home Position).

        Procedure:
        1. Accurately position both arms to the Home Pose using Direct Teaching.
        2. If resetting the head offset as well, align the head straight forward to the center.
        3. Click [OK] to begin the reset process.

        ※ During reset, Control Manager will be paused, 48V power will be cycled, and the robot connection will restart.
      ko: |
        ⚠️ [경고] Home Offset Reset 알림

        Home Offset Reset을 진행하면 현재 로봇 관절의 물리적 위치가 새로운 0도(Home Position)로 재설정됩니다.

        진행 순서:
        1. Direct Teaching 등을 사용하여 양 팔을 홈 자세(Home Pose) 위치에 정확히 맞춥니다.
        2. 헤드 오프셋도 초기화하려면 헤드를 정면 중앙으로 정렬합니다.
        3. [확인 (OK)]을 누르면 리셋 프로세스가 시작됩니다.

        ※ 리셋 도중 Control Manager가 일시 중지되고 48V 전원이 재인가되며 로봇 연결이 재시작됩니다.

  intrinsics_save_complete:
    title:
      en: "Save Complete"
      ko: "저장 완료"
    msg:
      en: "Camera intrinsics saved successfully to:\n{path}"
      ko: "카메라 내부 파라미터가 다음 경로에 저장되었습니다:\n{path}"
