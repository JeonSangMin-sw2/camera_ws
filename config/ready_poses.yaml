v1.2:
  joint:
    wrist_pitch:
      right_arm: [-55.0, -45.0, 25.0, -127.0, 90.0, 0.0, 0.0]
      left_arm: [-55.0, 45.0, -25.0, -127.0, -90.0, 0.0, 0.0]
    elbow:
      right_arm: [-117.0, -20.0, 0.0, 0.0, -100.0, 85.0, -115.0]
      left_arm: [-117.0, 20.0, 0.0, 0.0, 100.0, 85.0, 115.0]
    # Same posture as `marker` below, on purpose (v1.3 already pairs them this way).
    # J6 is solved from where the centre of the J5 circle sits relative to the J6 axis, so the
    # J5 arc (sweep_joint_B, +-15 deg) has to be swept in full. From the old wrist_pitch posture
    # the marker ran off the bottom of the frame part way through: 2026-09-21 captured only
    # 22.18 of 30 deg on the right arm and 26.29 on the left, both ending ~50 px from the image
    # edge, which biased the circle centre -- and the two arms unequally, since they lost
    # different amounts. The marker posture keeps the whole sweep in view (its own 40/40/45 deg
    # sweeps all complete with >100 px of margin).
    wrist_yaw2:
      right_arm: [-90.0, -40.0, 73.0, -97.0, 90.0, 90.0, -10.0]
      left_arm: [-90.0, 40.0, -73.0, -97.0, -80.0, 90.0, 10.0]
  marker:
    right_arm: [-90.0, -40.0, 73.0, -97.0, 90.0, 90.0, -10.0]
    left_arm: [-90.0, 40.0, -73.0, -97.0, -80.0, 90.0, 10.0]
  # Wizard gripper-change pose (2026-11-12, user): tool flange facing up so the gripper comes off easily. J3+J5 = -180
  # turns the flange up (FK on the model M v1.2 URDF, arm chains as on model A); J5 -70 stays clear of its -90 limit,
  # J1 10 deg out keeps the hands off the body (flange 10 deg from vertical).
  # Wizard auto exposure (user, 2026-11-25): the right wrist_pitch pose with J6 turned this far (deg) tilts the marker
  # towards the ceiling lights, the end of the Step 1 J6 sweep (+-22.5). At this pose J5 only spins the marker in its
  # plane, so the J5 +-15 checks never changed the glare angle. Model M v1.2, nominal camera: face up 17 deg, 25 deg from
  # facing the camera. v1.3 has none: there J6 spins the marker in its plane and J5 +15 already tilts it up.
  auto_exposure_ceiling_j6_deg: -22.5
  gripper_change:
    right_arm: [0.0, -10.0, 0.0, -110.0, 0.0, -70.0, 0.0]
    left_arm: [0.0, 10.0, 0.0, -110.0, 0.0, -70.0, 0.0]
  check_calib:
    right_arm: [-24.670293247716117,-39.97309779281507, 11.245521098854034, -107.94826174466372, -123.90104309118438, 62.20615349398536, 58.400917359415544]
    left_arm: [-24.673371649425416, 39.977181699521026, -11.2449384541747, -107.94870000866068, 123.90090751555407, 62.20615370729742, -58.400917505707554]
  # The check pose with the hands brought in (wizard 'Bring Together', held): check_calib puts both ee at
  # link_torso_5 x 350, y +-150, z 0 mm; this keeps x, z and the orientation with y +-100 mm. Solved on the
  # model M v1.2 simulator (scratch/check_gather_pose_sim.py, 2026-11-24): orientation change 0.005 deg.
  check_calib_gather:
    right_arm: [-28.7608, -36.0076, 17.6918, -109.1932, -117.6528, 55.7002, 54.7571]
    left_arm: [-28.7726, 36.0173, -17.692, -109.1955, 117.6485, 55.6984, -54.7536]
  # Post-Step 2 check at check_calib (sequences/verify.py): head [pan, tilt] and the right J6 turn (left mirrored)
  # that make the head camera see both markers there. A detected marker's -z faces the camera; the -42 deg first
  # used here turned the markers away and the real run saw neither (2026-11-24 16:51). Facing them needs +136 deg,
  # past the J6 limit (+-155); -180 is the best within it. Model M v1.2, nominal camera: markers 49 deg from
  # facing the camera (Step 2 poses <= 37), >= 60 px inside the image, about 300 mm away. User chose this, 2026-11-24.
  # Removed 2026-11-25: extra views (head 46, facing at head 35) always gave the same gap as this one, and check-region
  # poses added to Step 2 made the real hands 0.7 mm worse (do not retry; harness trap).
  check_calib_view:
    head_deg: [0.0, 58.0]
    j6_turn_deg: -180.0
  # Step 2 wrist-diversity poses (head robots, setting.yaml step2.wrist_diversity_poses): deltas in deg from the
  # Step 2 baseline -- right/left [J4, J5, J6], head [pan, tilt]; J0-J3 stay at the baseline. Chosen offline on
  # 2026-09-30 from the 09-29 15:13 D405 run within J4 +-25 / J5 +-20 / J6 +-30 deg (both markers in view with
  # 60 px margin, marker tilt to the camera <= 30 deg, range <= 330 mm, markers >= 11 cm apart; in the URDF
  # capsule collision model no pose comes closer to the torso/head or between the hands than the 64 base poses
  # did on the robot; re-checked on the 12:23 and 14:32 baselines). Offline estimate: weakest Step 2 direction
  # 2.4 -> 4.8, a 1 deg Step 1 J6 error reaches the check pose about 30 % less. The base plan is unchanged.
  # 2026-10-27: scaled to 60 % for one real run (16:01) and put back. At full range (14:42) the wrist poses moved
  # head pan -0.44 -> -0.62 deg and the check pose looked right; at 60 % they left it at -0.39 -> -0.41 and the
  # right hand sat about 3 mm behind again. Full-range wrist residuals were about 3x the base poses'.
  step2_wrist_diversity:
    - {right: [7.0, 3.3, 27.7], left: [-12.8, -13.8, 23.9], head: [-7.5, 12.5]}
    - {right: [24.5, -17.2, -8.0], left: [14.8, 6.4, -26.0], head: [5.0, 2.5]}
    - {right: [16.6, -16.9, -4.2], left: [-7.3, 15.7, -20.8], head: [-7.5, 0.0]}
    - {right: [21.6, -19.5, -18.4], left: [-6.9, 12.7, 3.0], head: [0.0, 2.5]}
    - {right: [-3.6, 9.8, 0.2], left: [-6.5, -10.3, 17.9], head: [-7.5, -7.5]}
    - {right: [5.7, -9.8, -7.4], left: [17.2, 17.8, -19.1], head: [0.0, -10.0]}
    - {right: [-0.9, 15.8, 15.9], left: [-24.7, -17.7, 29.6], head: [0.0, 0.0]}
    - {right: [22.5, -18.2, -15.9], left: [-3.1, 12.2, 3.9], head: [0.0, 2.5]}
    - {right: [23.4, -1.8, -11.2], left: [-17.0, -6.6, -3.4], head: [0.0, 10.0]}
    - {right: [24.6, -10.6, -10.1], left: [-21.2, 16.5, 19.7], head: [0.0, 0.0]}
    - {right: [6.0, -9.5, -0.3], left: [-2.7, 3.3, 4.2], head: [-10.0, 0.0]}
    - {right: [14.1, -14.5, -27.2], left: [19.0, 4.3, -24.3], head: [0.0, 0.0]}
    - {right: [13.6, -9.0, -19.0], left: [-15.1, 2.9, -13.2], head: [0.0, 10.0]}
    - {right: [19.2, 19.4, 19.0], left: [-12.3, -12.4, 1.5], head: [2.5, 0.0]}
    - {right: [9.8, 13.3, 27.8], left: [-17.4, -15.5, 8.2], head: [0.0, 2.5]}
    - {right: [-4.4, 0.3, 26.2], left: [-14.0, 18.7, -6.2], head: [-10.0, 0.0]}
    - {right: [16.9, -13.4, -0.6], left: [-3.1, 16.1, 3.5], head: [-2.5, 0.0]}
    - {right: [10.6, -1.0, -22.1], left: [23.6, 7.8, -22.3], head: [-2.5, -7.5]}
