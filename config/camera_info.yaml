# Per-camera-model bracket extrinsics (CAD nominal).
#
# Keys are the model FAMILY -- the bare body number, no variant suffix. A D435i and a D435f sit in
# the same housing on the same bracket, so both resolve to the 'D435' entry here; do not add a
# 'D435I' key. The matching intrinsics live in config/camera_intrinsics_<family lowercase>.yaml
# (e.g. camera_intrinsics_d435.yaml).
#
# To support a new model: measure head_base_to_cam and mount_to_cam for its colour lens and add an
# entry below. Until then the app starts with a warning and leaves setting.yaml untouched -- an
# entry of placeholder zeros would be silently applied as if it were real, so do not add one.
#
# Format: [x, y, z (m), roll, pitch, yaw (deg)]

D405:
  head_base_to_cam: [0.098, 0.009, 0.012, -90.0, 0.0, -90.0] # 42*42*23
  mount_to_cam: [0.047, 0.009, 0.057, -90.0, 0.0, -90.0]
  camera_mount_link: link_head_2
  temp_supported: false

D435: # covers D435, D435i and D435f
  head_base_to_cam: [0.1045, -0.0115, 0.044, -90.0, 0.0, -90.0]
  mount_to_cam: [0.0495, 0.0325, 0.057, -90.0, 0.0, -90.0]
  camera_mount_link: link_head_2
  temp_supported: false
